<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ГИА — Сестринское дело | Тест 500 вопросов</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3348;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e8eaf0;
    --muted: #8b91a8;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* SCREENS */
  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .screen.active { display: flex; }

  /* START SCREEN */
  .start-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .start-card .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 24px;
  }
  .start-card h1 {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .start-card p {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .mode-btn {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .mode-btn:hover { border-color: var(--accent); background: #1e2235; }
  .mode-btn.selected { border-color: var(--accent); background: rgba(79,142,247,0.1); }
  .mode-btn .mode-icon { font-size: 24px; margin-bottom: 8px; }
  .mode-btn .mode-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .mode-btn .mode-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .count-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    background: var(--surface2); border-radius: var(--radius); padding: 12px 16px;
  }
  .count-row label { font-size: 14px; color: var(--muted); flex: 1; text-align: left; }
  .count-row input[type=range] { flex: 2; accent-color: var(--accent); }
  .count-val { font-weight: 700; font-size: 16px; color: var(--accent); min-width: 36px; text-align: right; }

  .btn-start {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    font-family: 'Manrope', sans-serif;
  }
  .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-start:active { transform: translateY(0); }

  /* QUIZ SCREEN */
  #quizScreen {
    justify-content: flex-start;
    padding: 0;
  }

  .quiz-header {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .quiz-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--surface2);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.4s ease;
  }
  .score-badge {
    font-size: 13px;
    font-weight: 700;
    color: var(--correct);
    white-space: nowrap;
  }

  .quiz-body {
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .question-text {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 28px;
    color: var(--text);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 15px;
    line-height: 1.45;
    color: var(--text);
    text-align: left;
    font-family: 'Manrope', sans-serif;
    width: 100%;
  }
  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(79,142,247,0.07);
  }
  .option .letter {
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    transition: all 0.15s;
  }
  .option:hover:not(.locked) .letter {
    background: var(--accent);
    color: white;
  }
  .option.correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.1);
  }
  .option.correct .letter {
    background: var(--correct);
    color: white;
  }
  .option.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.1);
  }
  .option.wrong .letter {
    background: var(--wrong);
    color: white;
  }
  .option.locked { cursor: default; }

  .feedback {
    margin-top: 20px;
    padding: 14px 18px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    display: none;
  }
  .feedback.show { display: flex; align-items: center; gap: 10px; }
  .feedback.ok { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: var(--correct); }
  .feedback.err { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }

  .btn-next {
    margin-top: 24px;
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    font-family: 'Manrope', sans-serif;
    transition: opacity 0.2s;
  }
  .btn-next:hover { opacity: 0.88; }
  .btn-next.show { display: block; }

  /* REVIEW MODE */
  .explanation {
    margin-top: 16px;
    padding: 14px 18px;
    background: rgba(79,142,247,0.08);
    border: 1px solid rgba(79,142,247,0.25);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  .explanation.show { display: block; }

  /* RESULTS SCREEN */
  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .result-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin: 0 auto 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 800;
  }
  .result-circle.pass {
    background: rgba(34,197,94,0.15);
    border: 3px solid var(--correct);
    color: var(--correct);
  }
  .result-circle.fail {
    background: rgba(239,68,68,0.1);
    border: 3px solid var(--wrong);
    color: #f87171;
  }
  .result-circle small { font-size: 11px; font-weight: 600; opacity: 0.8; }
  .results-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .results-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-box {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 14px 10px;
  }
  .stat-val { font-size: 22px; font-weight: 800; }
  .stat-val.g { color: var(--correct); }
  .stat-val.r { color: var(--wrong); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-row { display: flex; gap: 10px; }
  .btn-outline {
    flex: 1;
    padding: 13px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: border-color 0.15s;
  }
  .btn-outline:hover { border-color: var(--accent); }
  .btn-primary {
    flex: 1;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-home {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    width: 34px;
    height: 34px;
    min-width: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.15s;
  }
  .btn-home:hover { border-color: var(--accent); color: var(--text); }
  .option.selected-exam {
    border-color: var(--accent);
    background: rgba(79,142,247,0.1);
  }
  .option.selected-exam .letter {
    background: var(--accent);
    color: white;
  }

  @media (max-width: 500px) {
    .start-card { padding: 28px 20px; }
    .mode-grid { grid-template-columns: 1fr; }
    .question-text { font-size: 15px; }
    .option { font-size: 14px; padding: 14px 16px; }
  }
  #resultsScreen {
    justify-content: flex-start;
    padding: 40px 24px;
    overflow-y: auto;
  }
  #resultsScreen .results-card {
    margin-bottom: 24px;
  }
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px 48px;
  }
  .review-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding-top: 8px;
  }
  .review-item {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    border-left: 3px solid;
  }
  .review-item.ok { border-color: var(--correct); }
  .review-item.err { border-color: var(--wrong); }
  .review-q {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .review-num {
    min-width: 22px;
    height: 22px;
    background: var(--surface2);
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    margin-top: 1px;
  }
  .review-ans { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding-left: 32px; }
  .rev-label { color: var(--muted); }
  .rev-ok { color: var(--correct); font-weight: 700; }
  .rev-wrong { color: var(--wrong); font-weight: 700; text-decoration: line-through; }
</style>
</head>
<body>

<!-- START SCREEN -->
<div class="screen active" id="startScreen">
  <div class="start-card">
    <div class="badge">ГИА · Сестринское дело</div>
    <h1>Тест на&nbsp;500 вопросов</h1>
    <p>Подготовка к государственной итоговой аттестации.<br>Выбери режим и количество вопросов.</p>

    <div class="mode-grid">
      <button class="mode-btn selected" data-mode="exam" onclick="selectMode(this)">
        <div class="mode-icon">🎯</div>
        <div class="mode-name">Экзамен</div>
        <div class="mode-desc">Правильный ответ — только после выбора</div>
      </button>
      <button class="mode-btn" data-mode="practice" onclick="selectMode(this)">
        <div class="mode-icon">📖</div>
        <div class="mode-name">Практика</div>
        <div class="mode-desc">Сразу показывает правильный ответ</div>
      </button>
      <button class="mode-btn" data-mode="shuffle" onclick="selectMode(this)">
        <div class="mode-icon">🔀</div>
        <div class="mode-name">Случайные</div>
        <div class="mode-desc">Вопросы и варианты перемешаны</div>
      </button>
      <button class="mode-btn" data-mode="mistakes" onclick="selectMode(this)">
        <div class="mode-icon">❌</div>
        <div class="mode-name">Ошибки</div>
        <div class="mode-desc">Повтор вопросов с ошибками</div>
      </button>
    </div>

    <div class="count-row">
      <label>Вопросов в сессии</label>
      <input type="range" id="countSlider" min="10" max="500" step="10" value="20" oninput="updateCount(this.value)">
      <span class="count-val" id="countVal">20</span>
    </div>

    <button class="btn-start" onclick="startQuiz()">Начать тест →</button>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div class="screen" id="quizScreen" style="display:none;flex-direction:column;align-items:stretch;">
  <div class="quiz-header">
    <button class="btn-home" onclick="goHome()" title="На главную">🏠</button>
    <span class="quiz-num" id="qNum">1 / 20</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="score-badge" id="scoreDisplay">✓ 0</span>
  </div>
  <div class="quiz-body">
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Следующий вопрос →</button>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div class="screen" id="resultsScreen">
  <div class="results-card">
    <div class="result-circle" id="resultCircle">
      <span id="resultPct">0%</span>
      <small id="resultLabel">результат</small>
    </div>
    <h2 id="resultTitle">Тест завершён</h2>
    <p class="sub" id="resultSub"></p>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val g" id="statCorrect">0</div><div class="stat-label">Верно</div></div>
      <div class="stat-box"><div class="stat-val r" id="statWrong">0</div><div class="stat-label">Ошибок</div></div>
      <div class="stat-box"><div class="stat-val" id="statTotal">0</div><div class="stat-label">Всего</div></div>
    </div>
    <div class="btn-row">
      <button class="btn-outline" onclick="retryMistakes()" id="btnRetry">Повторить ошибки</button>
      <button class="btn-primary" onclick="goHome()">На главную</button>
    </div>
  </div>
  <div id="examReview" class="exam-review" style="display:none"></div>
</div>

let mode = 'exam';
let sessionQuestions = [];
let currentIdx = 0;
let correctCount = 0;
let mistakes = JSON.parse(localStorage.getItem('gia_mistakes') || '[]');
let sessionMistakeIndices = [];
let answered = false;

function selectMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  mode = btn.dataset.mode;
  if (mode === 'mistakes') {
    const cnt = mistakes.length || 0;
    document.getElementById('countSlider').max = Math.max(cnt, 10);
    document.getElementById('countSlider').value = Math.min(cnt, 20);
    document.getElementById('countVal').textContent = Math.min(cnt, 20);
  } else {
    document.getElementById('countSlider').max = 500;
  }
}

function updateCount(v) {
  document.getElementById('countVal').textContent = v;
}

function shuffle(arr) {
  return arr.slice().sort(() => Math.random() - 0.5);
}

function startQuiz() {
  const count = parseInt(document.getElementById('countSlider').value);
  correctCount = 0;
  currentIdx = 0;
  sessionMistakeIndices = [];
  answered = false;

  if (mode === 'mistakes') {
    if (mistakes.length === 0) {
      alert('Нет сохранённых ошибок! Сначала пройди тест в другом режиме.');
      return;
    }
    const pool = shuffle(mistakes).slice(0, count);
    sessionQuestions = pool.map(i => {
      const q = {...ALL_QUESTIONS[i], origIdx: i};
      const correct = q.opts[0];
      q.opts = shuffle(q.opts);
      q.correctIdx = q.opts.indexOf(correct);
      return q;
    });
  } else if (mode === 'shuffle') {
    const indices = shuffle([...Array(500).keys()]).slice(0, count);
    sessionQuestions = indices.map(i => {
      const q = {...ALL_QUESTIONS[i], origIdx: i};
      const correct = q.opts[0];
      q.opts = shuffle(q.opts);
      q.correctIdx = q.opts.indexOf(correct);
      return q;
    });
  } else {
    const indices = shuffle([...Array(500).keys()]).slice(0, count);
    sessionQuestions = indices.map(i => {
      const q = {...ALL_QUESTIONS[i], origIdx: i};
      const correct = q.opts[0];
      q.opts = shuffle(q.opts);
      q.correctIdx = q.opts.indexOf(correct);
      return q;
    });
  }

  // Ensure correctIdx is set for non-shuffle modes
  sessionQuestions.forEach(q => {
    if (q.correctIdx === undefined) q.correctIdx = 0;
  });

  showScreen('quizScreen');
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active');
    s.style.display = 'none';
  });
  const el = document.getElementById(id);
  el.style.display = 'flex';
  el.classList.add('active');
}

function renderQuestion() {
  const q = sessionQuestions[currentIdx];
  const total = sessionQuestions.length;

  document.getElementById('qNum').textContent = `${currentIdx + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${(currentIdx / total) * 100}%`;
  document.getElementById('scoreDisplay').textContent = mode === 'exam' ? `${currentIdx + 1}/${total}` : `✓ ${correctCount}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('explanation').className = 'explanation';
  document.getElementById('btnNext').className = 'btn-next';
  answered = false;

  const letters = ['А', 'Б', 'В', 'Г'];
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });
}

function selectAnswer(chosenIdx) {
  if (answered) return;
  answered = true;

  const q = sessionQuestions[currentIdx];
  const correct = q.correctIdx;
  const options = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedback');
  const btnNext = document.getElementById('btnNext');

  // Store chosen answer for exam mode review
  q.chosen = chosenIdx;

  const isCorrect = chosenIdx === correct;
  if (isCorrect) {
    correctCount++;
  } else {
    const origIdx = q.origIdx !== undefined ? q.origIdx : currentIdx;
    if (!mistakes.includes(origIdx)) {
      mistakes.push(origIdx);
      localStorage.setItem('gia_mistakes', JSON.stringify(mistakes));
    }
    sessionMistakeIndices.push(currentIdx);
  }

  if (mode === 'exam') {
    // In exam mode: just highlight selected, no correct/wrong reveal, no feedback
    options[chosenIdx].classList.add('selected-exam');
    options.forEach(o => o.classList.add('locked'));
    btnNext.className = 'btn-next show';
    btnNext.textContent = currentIdx < sessionQuestions.length - 1 ? 'Следующий вопрос →' : 'Завершить тест →';
  } else {
    // Practice / shuffle / mistakes: show feedback immediately
    options.forEach(o => o.classList.add('locked'));
    options[correct].classList.add('correct');
    if (isCorrect) {
      feedback.textContent = '✓ Верно!';
      feedback.className = 'feedback show ok';
    } else {
      options[chosenIdx].classList.add('wrong');
      feedback.innerHTML = `✗ Неверно. Правильный ответ: <b>${q.opts[correct]}</b>`;
      feedback.className = 'feedback show err';
    }
    document.getElementById('scoreDisplay').textContent = `✓ ${correctCount}`;
    btnNext.className = 'btn-next show';
    btnNext.textContent = currentIdx < sessionQuestions.length - 1 ? 'Следующий вопрос →' : 'Завершить тест →';
  }
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= sessionQuestions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  const total = sessionQuestions.length;
  const pct = Math.round((correctCount / total) * 100);
  const pass = pct >= 70;

  document.getElementById('resultPct').textContent = pct + '%';
  document.getElementById('resultLabel').textContent = pass ? 'сдано' : 'не сдано';
  document.getElementById('resultCircle').className = 'result-circle ' + (pass ? 'pass' : 'fail');
  document.getElementById('resultTitle').textContent = pass ? '🎉 Отлично!' : 'Нужно повторить';
  document.getElementById('resultSub').textContent = `Правильных ответов: ${correctCount} из ${total} (порог — 70%)`;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statWrong').textContent = total - correctCount;
  document.getElementById('statTotal').textContent = total;

  const errCount = total - correctCount;
  const btn = document.getElementById('btnRetry');
  btn.textContent = `Повторить ошибки (${mistakes.length})`;
  btn.style.display = errCount > 0 ? 'block' : 'none';

  // In exam mode — show per-question review
  const reviewEl = document.getElementById('examReview');
  if (mode === 'exam') {
    const letters = ['А', 'Б', 'В', 'Г'];
    let html = '<div class="review-title">Разбор ответов</div>';
    sessionQuestions.forEach((q, i) => {
      const isOk = q.chosen === q.correctIdx;
      html += `<div class="review-item ${isOk ? 'ok' : 'err'}">
        <div class="review-q"><span class="review-num">${i+1}</span>${q.q}</div>
        <div class="review-ans">
          <span class="rev-label">Ваш ответ:</span>
          <span class="${isOk ? 'rev-ok' : 'rev-wrong'}">${q.chosen !== undefined ? q.opts[q.chosen] : '—'}</span>
          ${!isOk ? `<span class="rev-label" style="margin-left:12px">Правильно:</span> <span class="rev-ok">${q.opts[q.correctIdx]}</span>` : ''}
        </div>
      </div>`;
    });
    reviewEl.innerHTML = html;
    reviewEl.style.display = 'block';
  } else {
    reviewEl.style.display = 'none';
  }

  document.getElementById('progressFill').style.width = '100%';
  showScreen('resultsScreen');
}

function retryMistakes() {
  selectMode(document.querySelector('[data-mode="mistakes"]'));
  goHome();
}

function goHome() {
  showScreen('startScreen');
  document.getElementById('countSlider').max = 500;
  document.getElementById('countSlider').value = 20;
  document.getElementById('countVal').textContent = 20;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('[data-mode="exam"]').classList.add('selected');
  mode = 'exam';
}
</script>
</body>
</html>
